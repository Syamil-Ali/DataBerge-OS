# Disposable integration-test services only. Never deploy this S3 emulator.
name: data-berge-ci
services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: data_berge
      POSTGRES_USER: data_berge
      POSTGRES_PASSWORD: data_berge_dev
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_berge -d data_berge"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.5-alpine
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  s3:
    image: motoserver/moto:5.1.3@sha256:c96adff67d2bf82c3a61a6f1155db5300be44d82a9403919a6ff994d0e5438b7
    ports: ["127.0.0.1:9000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
