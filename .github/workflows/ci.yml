name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATA_DIR: ${{ runner.temp }}/data
      DB_PATH: ${{ runner.temp }}/data/app.db
      MLFLOW_TRACKING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install locked dependencies
        working-directory: backend
        run: pip install --require-hashes -r requirements.lock.txt
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app data_berge_core scripts
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Verify dependency consistency
        run: python -m pip check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  distributed-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATA_DIR: ${{ runner.temp }}/distributed-data
      DATABASE_URL: postgresql://data_berge:data_berge_dev@localhost:15432/data_berge
      REDIS_URL: redis://localhost:6380/0
      QUEUE_MODE: redis
      OBJECT_STORAGE_BACKEND: s3
      S3_BUCKET: data-berge
      S3_ENDPOINT_URL: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: data_berge
      S3_SECRET_ACCESS_KEY: data_berge_dev_secret
      RUN_DISTRIBUTED_TESTS: "1"
      MLFLOW_TRACKING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install locked dependencies
        working-directory: backend
        run: pip install --require-hashes -r requirements.lock.txt
      - name: Start distributed dependencies
        run: docker compose up -d postgres redis minio minio-init
      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: python -m scripts.migrate
      - name: Test PostgreSQL, Redis, S3 and queue integration
        working-directory: backend
        run: python -m unittest tests.test_distributed_integration -v
      - name: Show dependency logs on failure
        if: failure()
        run: docker compose logs postgres redis minio minio-init
      - name: Stop distributed dependencies
        if: always()
        run: docker compose down -v

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, distributed-integration]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t data-berge-backend .
      - run: docker build -f frontend/Dockerfile -t data-berge-frontend .
