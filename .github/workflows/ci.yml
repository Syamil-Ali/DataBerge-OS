name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATA_DIR: /tmp/data-berge-ci/backend-data
      DB_PATH: /tmp/data-berge-ci/backend-data/app.db
      MLFLOW_TRACKING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install locked dependencies
        working-directory: backend
        run: pip install --require-hashes -r requirements.lock.txt
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app data_berge_core scripts
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Verify dependency consistency
        run: python -m pip check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  distributed-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATA_DIR: /tmp/data-berge-ci/distributed-data
      DATABASE_URL: postgresql://data_berge:data_berge_dev@127.0.0.1:15432/data_berge
      REDIS_URL: redis://127.0.0.1:6380/0
      QUEUE_MODE: redis
      OBJECT_STORAGE_BACKEND: s3
      S3_BUCKET: data-berge
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: data_berge
      S3_SECRET_ACCESS_KEY: data_berge_dev_secret
      RUN_DISTRIBUTED_TESTS: "1"
      MLFLOW_TRACKING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install locked dependencies
        working-directory: backend
        run: pip install --require-hashes -r requirements.lock.txt
      - name: Start distributed dependencies
        run: docker compose -f docker-compose.ci.yml up -d --wait --wait-timeout 120
      - name: Create disposable S3 test bucket
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          import boto3
          client = boto3.client(
              "s3", endpoint_url=os.environ["S3_ENDPOINT_URL"],
              region_name=os.environ["S3_REGION"],
              aws_access_key_id=os.environ["S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["S3_SECRET_ACCESS_KEY"],
          )
          client.create_bucket(Bucket=os.environ["S3_BUCKET"])
          client.head_bucket(Bucket=os.environ["S3_BUCKET"])
          PY
      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: python -m scripts.migrate
      - name: Test PostgreSQL, Redis, S3 and queue integration
        working-directory: backend
        run: python -m unittest tests.test_distributed_integration -v
      - name: Show dependency logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs postgres redis s3
      - name: Stop distributed dependencies
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, distributed-integration]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t data-berge-backend backend
      - run: docker build -f frontend/Dockerfile -t data-berge-frontend frontend
