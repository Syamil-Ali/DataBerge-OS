apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-berge-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-berge-api
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: data-berge-worker-reports
spec:
  scaleTargetRef:
    name: data-berge-worker
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: redis
      metadata:
        addressFromEnv: REDIS_HOST
        passwordFromEnv: REDIS_PASSWORD
        listName: rq:queue:reports
        listLength: "2"
        activationListLength: "1"
        databaseIndex: "0"
    - type: redis
      metadata:
        addressFromEnv: REDIS_HOST
        passwordFromEnv: REDIS_PASSWORD
        listName: rq:queue:connectors
        listLength: "2"
        activationListLength: "1"
        databaseIndex: "0"
